[project]
name = "dllio-preprocess"
version = "0.1.0"
description = "DLLIO 교통 자료 전처리: 연결망, 장소 목록, 노선 계보, 지도 배경을 만들고 PostgreSQL에 싣는다."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2",
    "scipy>=1.14",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
    "holidays>=0.107",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dllio_preprocess"]
